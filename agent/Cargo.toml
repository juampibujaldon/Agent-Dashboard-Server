[package]
name = "agent"
version = "0.1.0"
edition = "2021"


[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["macros", "rt-multi-thread"] }

# HTTP client para hacer requests
reqwest = { version = "0.11", features = ["json"] }

# Serialización/Deserialización de JSON
serde = { version = "1.0", features = ["derive"] }

# Información del sistema
sysinfo = "0.30"

# Utilidades varias
whoami = "1.5"

# Logging estructurado
tracing = "0.1"
tracing-subscriber = "0.3"


# Manejo de errores
anyhow = "1.0"
thiserror = "1.0"

# Configuración
config = "0.14"

# Fechas y tiempo
chrono = { version = "0.4", features = ["serde"] }

uuid = { version = "1.0", features = ["v4", "serde"] }

# Generación de datos falsos para testing y simulación
fake = { version = "2.9", features = ["derive"] }
rand = "0.8"


[dev-dependencies]
# Testing
tokio-test = "0.4"
# Mocks para testing
mockito = "1.2"
# Assertions más expresivas
assert2 = "0.3"
serde_json = "1"
